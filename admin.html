<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>NOIRÉ | Admin Dashboard</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="header-title">
            <h1>NOIRÉ</h1>
            <span>لوحة تحكم المتجر</span>
        </div>

        <button type="button" id="logoutBtn" class="secondary-btn" style="display:none;">
            تسجيل الخروج
        </button>
    </header>

    <main>

        <!-- LOGIN -->
        <section class="product-form" id="adminLogin">

            <h2>تسجيل دخول المدير</h2>

            <form id="loginForm">

                <label for="loginEmail">البريد الإلكتروني</label>
                <input
                    type="email"
                    id="loginEmail"
                    autocomplete="username"
                    inputmode="email"
                    required
                >

                <label for="loginPassword">كلمة المرور</label>
                <input
                    type="password"
                    id="loginPassword"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="loginButton">
                    تسجيل الدخول
                </button>

                <p id="loginMessage"></p>

            </form>

        </section>


        <!-- DASHBOARD -->
        <div id="dashboardContent" style="display:none;">

            <!-- STATISTICS -->
            <section class="dashboard-stats">

                <div class="stat-card">
                    <h3>عدد المنتجات</h3>
                    <p id="productCount">0</p>
                </div>

                <div class="stat-card">
                    <h3>حالة المتجر</h3>
                    <p>نشط</p>
                </div>

            </section>


            <!-- ADD PRODUCT -->
            <section class="product-form">

                <h2>إضافة منتج جديد</h2>

                <form id="productForm">

                    <label for="productNameAr">اسم المنتج بالعربي</label>
                    <input type="text" id="productNameAr" required>

                    <label for="productName">اسم المنتج بالإنجليزي</label>
                    <input type="text" id="productName" required>

                    <label for="productPrice">السعر (EGP)</label>
                    <input
                        type="number"
                        id="productPrice"
                        min="1"
                        inputmode="numeric"
                        required
                    >

                    <label for="productDescriptionAr">وصف المنتج بالعربي (اختياري)</label>
                    <textarea id="productDescriptionAr"></textarea>

                    <label for="productDescription">وصف المنتج بالإنجليزي (اختياري)</label>
                    <textarea id="productDescription"></textarea>

                    <!-- PRODUCT IMAGE -->
                    <label for="productImage">صورة المنتج</label>
                    <input
                        type="file"
                        id="productImage"
                        accept="image/jpeg,image/png,image/webp"
                        required
                    >

                    <img id="imagePreview" src="" alt="معاينة الصورة">

                    <button type="submit">إضافة المنتج</button>

                </form>

            </section>


            <!-- PRODUCTS MANAGEMENT -->
            <section class="products-management">

                <div class="admin-heading">
                    <h2>إدارة المنتجات</h2>
                </div>

                <div id="adminProducts"></div>

            </section>

        </div>

    </main>


    <!-- EDIT PRODUCT MODAL -->
    <div id="editModal" class="modal-overlay" style="display:none;">

        <div class="modal-box">

            <h2>تعديل المنتج</h2>

            <form id="editForm">

                <label for="editNameAr">اسم المنتج بالعربي</label>
                <input type="text" id="editNameAr" required>

                <label for="editName">اسم المنتج بالإنجليزي</label>
                <input type="text" id="editName" required>

                <label for="editPrice">السعر (EGP)</label>
                <input
                    type="number"
                    id="editPrice"
                    min="1"
                    inputmode="numeric"
                    required
                >

                <label for="editDescriptionAr">وصف المنتج بالعربي</label>
                <textarea id="editDescriptionAr"></textarea>

                <label for="editDescription">وصف المنتج بالإنجليزي</label>
                <textarea id="editDescription"></textarea>

                <label for="editImage">تغيير الصورة (اتركها فارغة للإبقاء على الصورة الحالية)</label>
                <input
                    type="file"
                    id="editImage"
                    accept="image/jpeg,image/png,image/webp"
                >

                <img id="editImagePreview" src="" alt="معاينة الصورة">

                <div class="modal-actions">
                    <button type="submit" id="editSaveBtn">حفظ التعديلات</button>
                    <button type="button" id="editCancelBtn" class="secondary-btn">إلغاء</button>
                </div>

            </form>

        </div>

    </div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ADMIN JAVASCRIPT -->
    <script src="admin.js"></script>

</body>
</html>

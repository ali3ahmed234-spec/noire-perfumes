<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOIRÉ | Admin Dashboard</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>NOIRÉ</h1>
        <span>لوحة تحكم المتجر</span>
    </header>

    <main>

        <!-- LOGIN -->
        <section class="product-form" id="adminLogin">

            <h2>تسجيل دخول المدير</h2>

            <form id="loginForm">

                <label for="loginEmail">البريد الإلكتروني</label>
                <input type="email" id="loginEmail" required>

                <label for="loginPassword">كلمة المرور</label>
                <input type="password" id="loginPassword" required>

                <button type="submit" id="loginButton">
                    تسجيل الدخول
                </button>

                <p id="loginMessage"></p>

            </form>

        </section>


        <!-- DASHBOARD -->
        <div id="dashboardContent" style="display:none;">

            <!-- STATISTICS -->
            <section class="dashboard-stats">

                <div class="stat-card">
                    <h3>عدد المنتجات</h3>
                    <p id="productCount">0</p>
                </div>

                <div class="stat-card">
                    <h3>حالة المتجر</h3>
                    <p>نشط</p>
                </div>

            </section>


            <!-- ADD PRODUCT -->
            <section class="product-form">

                <h2>إضافة منتج جديد</h2>

                <form id="productForm">

                    <label for="productNameAr">
                        اسم المنتج بالعربي
                    </label>

                    <input
                        type="text"
                        id="productNameAr"
                        required
                    >


                    <label for="productName">
                        اسم المنتج بالإنجليزي
                    </label>

                    <input
                        type="text"
                        id="productName"
                        required
                    >


                    <label for="productPrice">
                        السعر (EGP)
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        min="1"
                        required
                    >


                    <label for="productDescriptionAr">
                        وصف المنتج بالعربي
                    </label>

                    <textarea
                        id="productDescriptionAr"
                        required
                    ></textarea>


                    <label for="productDescription">
                        وصف المنتج بالإنجليزي
                    </label>

                    <textarea
                        id="productDescription"
                        required
                    ></textarea>


                    <!-- PRODUCT IMAGE -->
                    <label for="productImage">
                        صورة المنتج
                    </label>

                    <input
                        type="file"
                        id="productImage"
                        accept="image/*"
                        required
                    >

                    <img
                        id="imagePreview"
                        src=""
                        alt="معاينة الصورة"
                        style="
                            display:none;
                            width:150px;
                            height:150px;
                            object-fit:cover;
                            border-radius:10px;
                            margin-top:10px;
                        "
                    >


                    <button type="submit">
                        إضافة المنتج
                    </button>

                </form>

            </section>


            <!-- PRODUCTS MANAGEMENT -->
            <section class="products-management">

                <div class="admin-heading">

                    <h2>إدارة المنتجات</h2>

                    <button
                        type="button"
                        id="logoutBtn"
                    >
                        تسجيل الخروج
                    </button>

                </div>

                <div id="adminProducts"></div>

            </section>

        </div>

    </main>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ADMIN JAVASCRIPT -->
    <script src="admin.js"></script>

</body>
</html>

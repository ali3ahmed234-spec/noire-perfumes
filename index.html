<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOIRÉ | Luxury Perfumes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="navbar">
            <div class="logo">
                <h1>NOIRÉ</h1>
                <p>LUXURY PERFUMES</p>
            </div>

            <nav>
                <a href="#" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
                <a href="#products" data-ar="العطور" data-en="Products">العطور</a>
                <a href="#cart" data-ar="السلة" data-en="Cart">السلة</a>
            </nav>

            <button id="languageBtn">EN</button>
        </div>
    </header>

    <main>
        <h2 data-ar="اكتشف عالم الفخامة"
            data-en="Discover The World Of Luxury">
            اكتشف عالم الفخامة
        </h2>

        <p data-ar="عطرك هو توقيعك الخاص"
           data-en="Your Fragrance, Your Signature">
            عطرك هو توقيعك الخاص
        </p>

        <button id="exploreBtn"
                data-ar="اكتشف مجموعتنا"
                data-en="Explore Collection">
            اكتشف مجموعتنا
        </button>
    </main>

    <section class="products" id="products">
        <div class="section-title">
            <p>OUR COLLECTION</p>
            <h2 data-ar="مجموعتنا المميزة"
                data-en="Our Exclusive Collection">
                مجموعتنا المميزة
            </h2>
        </div>

        <div class="product-container" id="productContainer">
            <p>جاري تحميل المنتجات...</p>
        </div>
    </section>

    <section class="cart" id="cart">

        <h2 data-ar="سلة المشتريات"
            data-en="Shopping Cart">
            سلة المشتريات
        </h2>

        <div id="cartItems">
            <p data-ar="السلة فارغة حالياً"
               data-en="Your cart is empty">
                السلة فارغة حالياً
            </p>
        </div>

        <div class="cart-total">
            <h3>
                <span data-ar="الإجمالي:" data-en="Total:">الإجمالي:</span>
                <span id="totalPrice">0</span> EGP
            </h3>
        </div>

        <button id="checkoutBtn"
                data-ar="اطلب الآن"
                data-en="Order Now">
            اطلب الآن
        </button>

        <form id="checkoutForm" class="checkout-form">

            <h3 data-ar="بيانات التوصيل"
                data-en="Delivery Details">
                بيانات التوصيل
            </h3>

            <label for="customerName"
                   data-ar="الاسم بالكامل"
                   data-en="Full Name">
                الاسم بالكامل
            </label>

            <input type="text" id="customerName"
                   placeholder="اكتب اسمك"
                   data-placeholder-ar="اكتب اسمك"
                   data-placeholder-en="Enter your name"
                   required>

            <label for="customerPhone"
                   data-ar="رقم الهاتف"
                   data-en="Phone Number">
                رقم الهاتف
            </label>

            <input type="tel" id="customerPhone"
                   placeholder="01xxxxxxxxx"
                   data-placeholder-ar="01xxxxxxxxx"
                   data-placeholder-en="01xxxxxxxxx"
                   required>

            <label for="customerAddress"
                   data-ar="عنوان التوصيل"
                   data-en="Delivery Address">
                عنوان التوصيل
            </label>

            <textarea id="customerAddress"
                      placeholder="المحافظة والمنطقة والعنوان بالتفصيل"
                      data-placeholder-ar="المحافظة والمنطقة والعنوان بالتفصيل"
                      data-placeholder-en="Governorate, area and full address"
                      required></textarea>

            <button type="submit"
                    data-ar="تأكيد الطلب عبر واتساب"
                    data-en="Confirm Order via WhatsApp">
                تأكيد الطلب عبر واتساب
            </button>

        </form>
    </section>

    <div id="productModal" class="product-modal">
        <div class="modal-content">

            <button id="closeModal" class="close-modal">×</button>

            <div class="modal-image">
                <img id="modalProductImage"
                     src=""
                     alt="Perfume"
                     onerror="this.style.display='none'">
            </div>

            <h2 id="modalName">Black Edition</h2>
            <p id="modalDescription"></p>
            <h3 id="modalPrice"></h3>

            <button id="modalAddToCart"
                    data-ar="أضف للسلة"
                    data-en="Add To Cart">
                أضف للسلة
            </button>

        </div>
    </div>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Store JavaScript -->
    <script src="script.js"></script>

</body>
</html>
